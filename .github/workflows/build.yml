name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # sdkmanager 使用 runner 的 Java 17，旧版 Gradle 则继续使用 Java 11。
      - name: Install Android build dependencies
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-32" \
            "build-tools;30.0.3" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Configure target package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          package = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+", package):
              raise SystemExit("Invalid Android package name")
          module = Path("module.gradle")
          module.write_text(module.read_text().replace(
              'moduleDescription = "', f'moduleDescription = "({package}) ', 1))
          game = Path("module/src/main/cpp/game.h")
          game.write_text(game.read_text().replace("com.game.packagename", package))
          PY

      - name: Build module
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :module:assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: zygisk-il2cppdumper
          path: out/*-release.zip
          if-no-files-found: error
          compression-level: 0
